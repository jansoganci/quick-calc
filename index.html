<!DOCTYPE html>
<html lang="tr" data-theme="qc">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static fallback for the first paint. src/app/shellCopy.ts owns this copy. -->
    <title>Maliyet — Bir satıştan geriye ne kalıyor?</title>
    <meta
      name="description"
      content="Kafe, restoran ve küçük işletmeler için sade bir maliyet ve fizibilite hesabı. Muhasebe bilgisi gerektirmez."
    />
    <link rel="canonical" href="https://maliyet.lol/" />

    <!--
      Share tags. Unlike the title above these are not a fallback: the crawlers
      that build link previews do not run scripts, so what is written here is the
      only version they ever see. `src/app/shellCopy.ts` stays the source of truth
      for the wording — when the slogan or description changes there, mirror it
      here. `public/og.jpg` is a 1200×630 render of a Quick result in the app's own
      palette and type; when the slogan or the breakdown copy changes, the card is
      re-rendered rather than edited, so the preview never disagrees with the app.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maliyet" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:url" content="https://maliyet.lol/" />
    <meta property="og:title" content="Maliyet — Bir satıştan geriye ne kalıyor?" />
    <meta
      property="og:description"
      content="Kafe, restoran ve küçük işletmeler için sade bir maliyet ve fizibilite hesabı. Muhasebe bilgisi gerektirmez."
    />
    <meta property="og:image" content="https://maliyet.lol/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="140,00 TL’lik ortalama satışın 121,34 TL’si maliyete gidiyor, 18,66 TL’si işletmede kalıyor."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maliyet — Bir satıştan geriye ne kalıyor?" />
    <meta
      name="twitter:description"
      content="Kafe, restoran ve küçük işletmeler için sade bir maliyet ve fizibilite hesabı. Muhasebe bilgisi gerektirmez."
    />
    <meta name="twitter:image" content="https://maliyet.lol/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="140,00 TL’lik ortalama satışın 121,34 TL’si maliyete gidiyor, 18,66 TL’si işletmede kalıyor."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
