<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Maliyet">
  <!--
    The "M" is drawn as an outline rather than set as <text>: a favicon renders
    with no webfont loaded, so IBM Plex would silently fall back to whatever the
    platform's default sans is and the mark would differ on every machine. The
    proportions here follow Plex Sans SemiBold — 3.4-unit stems, 14-unit cap
    height — so at 16px the stems land just under 2px and stay legible.

    The accent rule under the letter is the same 2px ink-accent underline the app
    uses for the active mode tab; it is quoted, not invented.
  -->
  <style>
    .ground { fill: #16181C; }
    .letter { fill: #FFFFFF; }
    .rule { fill: #1D3A5F; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #FFFFFF; }
      .letter { fill: #16181C; }
    }
  </style>
  <rect class="ground" width="32" height="32"/>
  <path class="letter" d="M7.6 23V9h4l4.4 8.2L20.4 9h4v14h-3.4v-8.8l-4 7.4h-2l-4-7.4V23z"/>
  <rect class="rule" x="6" y="25" width="20" height="2.5"/>
</svg>
